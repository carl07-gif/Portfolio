<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Crisp drop shadow & filters -->
    <filter id="nittShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <path id="topTextArc" d="M 46 150 A 104 104 0 1 1 254 150" fill="none"/>
    <path id="botTextArc" d="M 246 160 A 104 104 0 0 1 54 160" fill="none"/>
  </defs>

  <!-- Outer Ring with rich terracotta brown fill -->
  <circle cx="150" cy="150" r="142" fill="#8c2617" stroke="#e6cfbe" stroke-width="6" filter="url(#nittShadow)"/>
  <circle cx="150" cy="150" r="136" fill="none" stroke="#66190c" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="98" fill="#8c2617" stroke="#e6cfbe" stroke-width="4"/>

  <!-- Circular Text in Authentic Proportions -->
  <text font-family="'Space Grotesk', 'Arial Black', -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="3.2">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">NATIONAL INSTITUTE OF TECHNOLOGY</textPath>
  </text>
  <text font-family="'Space Grotesk', 'Arial Black', -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="4.5">
    <textPath href="#botTextArc" startOffset="50%" text-anchor="middle">TIRUCHIRAPPALLI</textPath>
  </text>

  <!-- Side Star Separators -->
  <circle cx="43" cy="152" r="3.5" fill="#ffffff"/>
  <circle cx="257" cy="152" r="3.5" fill="#ffffff"/>

  <!-- Center White Shield Emblem -->
  <g transform="translate(150, 150)">
    <!-- White Shield Background with crisp brown outline -->
    <path d="M -58 -36 C -58 -36 -46 -36 -46 -48 L 46 -48 C 46 -36 58 -36 58 -36 L 58 -8 C 50 -8 44 2 44 14 C 44 26 50 36 58 36 L 58 56 C 28 66 0 68 -58 56 L -58 36 C -50 36 -44 26 -44 14 C -44 2 -50 -8 -58 -8 Z" 
          fill="#ffffff" stroke="#8c2617" stroke-width="3" stroke-linejoin="round"/>

    <!-- Gear / Cogwheel on Top Shield Crest -->
    <g transform="translate(0, -48)">
      <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#8c2617" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#8c2617" stroke-width="2"/>
      <!-- Gear spokes -->
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#8c2617" stroke-width="2"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#8c2617" stroke-width="2"/>
      <line x1="-11.3" y1="-11.3" x2="11.3" y2="11.3" stroke="#8c2617" stroke-width="2"/>
      <line x1="11.3" y1="-11.3" x2="-11.3" y2="11.3" stroke="#8c2617" stroke-width="2"/>
    </g>

    <!-- Satyameva Jayate text -->
    <text x="0" y="-24" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="700" fill="#8c2617" text-anchor="middle">सत्यमेव जयते</text>

    <!-- Knowledge Lamps (Diyas) on Left and Right -->
    <g transform="translate(-32, -26)">
      <path d="M -8 0 Q 0 7 8 0 Z" fill="none" stroke="#e02050" stroke-width="1.8"/>
      <path d="M 0 -1 Q -3 -5 0 -9 Q 3 -5 0 -1 Z" fill="#e02050"/>
    </g>
    <g transform="translate(32, -26)">
      <path d="M -8 0 Q 0 7 8 0 Z" fill="none" stroke="#e02050" stroke-width="1.8"/>
      <path d="M 0 -1 Q -3 -5 0 -9 Q 3 -5 0 -1 Z" fill="#e02050"/>
    </g>

    <!-- Central Archimedes with Lever Oval -->
    <g transform="translate(0, -6)">
      <ellipse cx="0" cy="0" rx="26" ry="14" fill="none" stroke="#1d8cd7" stroke-width="1.6"/>
      <!-- Globe -->
      <circle cx="-10" cy="2" r="6" fill="none" stroke="#8c2617" stroke-width="1.4"/>
      <!-- Archimedes & Lever -->
      <line x1="-14" y1="7" x2="14" y2="-7" stroke="#8c2617" stroke-width="1.6"/>
      <circle cx="8" cy="-5" r="2.5" fill="#8c2617"/>
      <path d="M 8 -2 L 10 5 L 6 9" fill="none" stroke="#8c2617" stroke-width="1.4"/>
    </g>

    <!-- Transmission Tower (Left) -->
    <g transform="translate(-30, 24)">
      <line x1="0" y1="-26" x2="-8" y2="18" stroke="#1e293b" stroke-width="2"/>
      <line x1="0" y1="-26" x2="8" y2="18" stroke="#1e293b" stroke-width="2"/>
      <line x1="-3" y1="-12" x2="3" y2="-12" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="-5" y1="-2" x2="5" y2="-2" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="-7" y1="8" x2="7" y2="8" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="-5" y1="-2" x2="7" y2="8" stroke="#1e293b" stroke-width="1.2"/>
      <line x1="5" y1="-2" x2="-7" y2="8" stroke="#1e293b" stroke-width="1.2"/>
    </g>

    <!-- Rockfort Temple (Center) -->
    <g transform="translate(0, 32)">
      <!-- Mountain base -->
      <path d="M -24 14 Q -12 -4 0 -10 Q 12 -4 24 14 Z" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <!-- Temple atop hill -->
      <path d="M -8 -10 L -8 -22 L 0 -28 L 8 -22 L 8 -10 Z" fill="#8c2617" stroke="#8c2617" stroke-width="1.2"/>
      <line x1="0" y1="-28" x2="0" y2="-32" stroke="#8c2617" stroke-width="1.5"/>
      <!-- Church spire next to temple -->
      <line x1="9" y1="-10" x2="9" y2="-24" stroke="#8c2617" stroke-width="1.5"/>
      <line x1="7" y1="-20" x2="11" y2="-20" stroke="#8c2617" stroke-width="1.2"/>
    </g>

    <!-- Multi-Story Structure (Right) -->
    <g transform="translate(30, 24)">
      <rect x="-9" y="-22" width="18" height="40" fill="none" stroke="#1e293b" stroke-width="2"/>
      <line x1="-9" y1="-12" x2="9" y2="-12" stroke="#1e293b" stroke-width="1.4"/>
      <line x1="-9" y1="-2" x2="9" y2="-2" stroke="#1e293b" stroke-width="1.4"/>
      <line x1="-9" y1="8" x2="9" y2="8" stroke="#1e293b" stroke-width="1.4"/>
      <line x1="-3" y1="-22" x2="-3" y2="18" stroke="#1e293b" stroke-width="1.4"/>
      <line x1="3" y1="-22" x2="3" y2="18" stroke="#1e293b" stroke-width="1.4"/>
    </g>

    <!-- Year 1964 -->
    <text x="0" y="52" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="900" fill="#8c2617" text-anchor="middle" letter-spacing="1">1964</text>
  </g>
</svg>
